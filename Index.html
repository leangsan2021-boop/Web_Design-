<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document-Structure</title>
</head>

<body>
  <table border="1" width="760" cellspacing="10" cellpadding="10" align="center" style="text-align: center;">

    <tr>
      <th colspan="2" height="70">
        &lt;header&gt;
      </th>
    </tr>

    <tr>
      <th colspan="2" height="50">
        &lt;nav&gt;
      </th>
    </tr>

    <tr>
      <!-- Main Content -->
      <th width="65%" valign="top">
        <table width="100%" border="1" cellspacing="0" cellpadding="0">

          <tr>
            <th height="30" align="left">
              &lt;main&gt;
            </th>
          </tr>

          <tr>
            <th height="150">
              &lt;article&gt;
            </th>
          </tr>

          <tr>
            <th height="150">
              &lt;section&gt;
            </th>
          </tr>

        </table>
      </th>

      <!-- Aside -->
      <th width="30%" valign="top">
        <table width="100%" border="1" cellspacing="0" cellpadding="0">

          <tr>
            <th height="340">
              &lt;aside&gt;
            </th>
          </tr>

        </table>
      </th>
    </tr>

    <tr>
      <th colspan="2" height="50">
        &lt;footer&gt;
      </th>
    </tr>

  </table>
</body>
</html>
